<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои задачи</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="container">
        <h1>Мои задачи</h1>
        <div class="form">
        <input 
            id="taskInput"
            type="text"
            placeholder="Введите задачу"
        >
        <button id="addButton">
            Добавить
        </button>
    </div>

    <div class="info">
        <span>
            Всего: <b id="total">0</b>
        </span>

        <span>
            Выполнено: <b id="completed">0</b>
        </span>
    </div>

    <div id="taskList">
        <!-- тут будут классы task-text -->
    </div>
    </div>

<script src="index.js"></script>
</body>
</html>
